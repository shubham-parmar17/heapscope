name: ci

on: [push, pull_request]

jobs:
  backend-auth-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install fastapi==0.110.1 google-auth==2.62.1 httpx==0.28.1 pydantic==2.14.3 pymongo==4.18.2 pytest==9.2.0 pytest-xdist==3.8.0
      - run: pytest -o addopts='' tests/test_google_oauth_flow.py
        working-directory: backend

  cpp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake libgtest-dev
      - run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build cpp/build -j
      - run: ./cpp/build/alloclab_tests
      - run: ./cpp/build/alloclab_bench 200000

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - run: cpp/wasm/build_wasm.sh
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node cpp/wasm/smoke.mjs

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd frontend && yarn install --frozen-lockfile
      - run: cd frontend && yarn typecheck
      - run: cd frontend && REACT_APP_BACKEND_URL=http://localhost:8001 yarn build
